version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: app-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_PATH=/app/data/app.db
      - LOGS_DIR=/app/logs
      - UPLOAD_DIR=/app/data/uploads
      - DOMAIN=${DOMAIN:-localhost}
      - API_HOST=${API_HOST:-http://backend:3000}
      - CLIENT_HOST=${CLIENT_HOST:-http://localhost:3001}
      - COMPANY_NAME=${COMPANY_NAME:-Enterprise Technologies}
      - COMPANY_TAGLINE=${COMPANY_TAGLINE:-Enterprise Software Architecture & Infrastructure Solutions}
      - COMPANY_EMAIL=${COMPANY_EMAIL:-info@example.com}
      - COMPANY_WEBSITE=${COMPANY_WEBSITE:-www.example.com}
    volumes:
      - ./src:/app/src
      - ./next.config.js:/app/next.config.js
      - ./jsconfig.json:/app/jsconfig.json
      - ./data:/app/data
      - ./logs:/app/logs
      - /app/node_modules
      - /app/.next
    restart: always
    command: sh -c "rm -rf app && cp -r src/client app && node --watch src/server/index.js"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  client:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: app-client
    ports:
      - "${CLIENT_PORT:-3001}:${CLIENT_PORT:-3001}"
    environment:
      - NODE_ENV=development
      - SHELL=/bin/sh
      - CLIENT_PORT=${CLIENT_PORT:-3001}
      - API_HOST=${API_HOST:-http://backend:3000}
      - DOMAIN=${DOMAIN:-localhost}
      - COMPANY_NAME=${COMPANY_NAME:-Enterprise Technologies}
      - COMPANY_TAGLINE=${COMPANY_TAGLINE:-Enterprise Software Architecture & Infrastructure Solutions}
      - COMPANY_EMAIL=${COMPANY_EMAIL:-info@example.com}
      - COMPANY_WEBSITE=${COMPANY_WEBSITE:-www.example.com}
      - NEXT_PUBLIC_COMPANY_NAME=${COMPANY_NAME:-Enterprise Technologies}
      - NEXT_PUBLIC_COMPANY_TAGLINE=${COMPANY_TAGLINE:-Enterprise Software Architecture & Infrastructure Solutions}
      - NEXT_PUBLIC_COMPANY_EMAIL=${COMPANY_EMAIL:-info@example.com}
      - NEXT_PUBLIC_COMPANY_WEBSITE=${COMPANY_WEBSITE:-www.example.com}
    volumes:
      - ./src:/app/src
      - ./next.config.js:/app/next.config.js
      - ./jsconfig.json:/app/jsconfig.json
      - /app/node_modules
      - /app/.next
    restart: always
    command: sh -c "rm -rf app && cp -r src/client app && if [ ! -f app/page.js ]; then echo '❌ App directory setup failed - page.js not found'; exit 1; fi && echo '✅ App directory verified' && pnpm exec next dev -p ${CLIENT_PORT:-3001}"
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: caddy:latest
    container_name: app-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile
      - caddy_data_local:/data
      - caddy_config_local:/config
      - ./logs:/var/log/caddy
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
      client:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data_local:
  caddy_config_local:
