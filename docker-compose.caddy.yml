version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/app.db
      - LOGS_DIR=/app/logs
      - UPLOAD_DIR=/app/data/uploads
      - DOMAIN=${DOMAIN:-localhost}
      - API_HOST=${API_HOST:-http://backend:3000}
      - CLIENT_HOST=${CLIENT_HOST:-http://localhost:3001}
      - COMPANY_NAME=${COMPANY_NAME:-Enterprise Technologies}
      - COMPANY_TAGLINE=${COMPANY_TAGLINE:-Enterprise Software Architecture & Infrastructure Solutions}
      - COMPANY_EMAIL=${COMPANY_EMAIL:-info@example.com}
      - COMPANY_WEBSITE=${COMPANY_WEBSITE:-www.example.com}
    volumes:
      # Persist database and uploads
      - ./data:/app/data
      # Persist logs
      - ./logs:/app/logs
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: caddy:latest
    container_name: app-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # For HTTP/3
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ./logs:/var/log/caddy
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

