version: '3.8'

services:
  honeypot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truarch-honeypot
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/honeypot.db
      - LOGS_DIR=/app/logs
      - UPLOAD_DIR=/app/data/uploads
    volumes:
      # Persist database and uploads
      - ./data:/app/data
      # Persist logs
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - default

